# 元征 · 合伙人赋能平台 - Alembic 配置

[alembic]
# 迁移脚本目录
script_location = migrations

# 模版文件（用于生成新迁移）
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 截断长的修订 ID
truncate_slug_length = 40

# 版本表名
version_table = alembic_version

# 版本表模式
version_table_schema = 

# 版本路径分隔符
version_path_separator = os

# 预置模块路径
prepend_sys_path = .

# 输出编码
output_encoding = utf-8

# SQLAlchemy URL（从环境变量读取）
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

